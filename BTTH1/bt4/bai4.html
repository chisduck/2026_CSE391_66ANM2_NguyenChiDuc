<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Employee Form - Table Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>

    <h3>Basic Info</h3>
    <hr>
    <table>
        <tr>
            <td>Employee ID</td>
            <td><input type="text" value="9"></td>
        </tr>

        <tr>
            <td>Last Name</td>
            <td><input type="text" value="Dodsworth"></td>
        </tr>

        <tr>
            <td>First Name</td>
            <td><input type="text" value="Anne"></td>
        </tr>

        <tr>
            <td>Gender</td>
            <td>
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
                <input type="radio" name="gender"> XXX
                <input type="radio" name="gender" checked> ZZZ 
            </td>
        </tr>

        <tr>
            <td>Title</td>
            <td><input type="text" value="Sales Representative"></td>
        </tr>

        <tr>
            <td>Suffix</td>
            <td><input type="text" value="Ms."></td>
        </tr>

        <tr>
            <td>BirthDate</td>
            <td><input type="date"></td>
        </tr> 

        <tr>
            <td>HireDate</td>
            <td><input type="date"></td>
        </tr> 

        <tr>
            <td>SSN # (if applicable)</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td>Reports To</td>
            <td>
                <select>
                    <option>Buchanan</option>
                    <option>Gon</option>
                    <option>Kilua</option>
                </select>
            </td>
        </tr>
    </table>

    <h3>Contact Info</h3>
    <hr>
    <table>
        <tr>
            <td>Email</td>
            <td><input type="email" placeholder="name@example.com"></td>
        </tr>

        <tr>
            <td>Address</td>
            <td><input type="text" value="7 Houndstooth Rd."></td>
        </tr>

        <tr>
            <td>City</td>
            <td><input type="text" value="London"></td>
        </tr>

        <tr>
            <td>Region</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td>Postal Code</td>
            <td><input type="text" value="WG2 7LT"></td>
        </tr>

        <tr>
            <td>Country</td>
            <td>
                <select>
                    <option>Russian Federation</option>
                    <option>Vietnam</option>
                    <option>USA</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>US Home Phone</td>
            <td><input type="tel" pattern="[0-9]{10}"></td>
        </tr>

        <tr>
            <td>Photo</td>
            <td><input type="file" accept="image/png, image/jpeg"
multiple></td>
        </tr>
    </table>

    <h3>Optional Info</h3>
    <hr>
    <table>
        <tr>
            <td>Notes</td>
            <td>
                <textarea rows="8">Anne has a BA degree in English from St. Lawrence College. She is fluent in French and German.ZZZ
                </textarea>
            </td>
        </tr>

        <tr>
            <td>Preferred Shift</td>
            <td>
                <input type="checkbox"> Regular
                <input type="checkbox" checked> Gravy Yard
            </td>
        </tr>

        <tr>
            <td>Active?</td>
            <td><input type="checkbox" checked></td>
        </tr>

        <tr>
             <td>Are you human?</td>
            <td><input type="text" placeholder="Enter code"></td>
        </tr>
    </table>

    <div class="btn">
        <button type="submit">Submit</button>
        <button type="reset">Cancel</button>
    </div>

</form>
</body>
