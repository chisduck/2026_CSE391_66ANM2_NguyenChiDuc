<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 05 - HR Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">HR Management</div>
    <div class="menu">
        <a href="#">Home</a>
        <a href="#">Contact</a>
    </div>
    <div class="search">
        <input type="text" placeholder="Search...">
        <button>Search</button>
    </div>
</div>

<!-- MAIN -->
<div class="container">

    <div class="title-bar">
        <h2>Employee</h2>
        <button class="btn-add">+ Add</button>
    </div>

    <!-- TABLE -->
    <table class="employee-table">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Position</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Fatima Beatriz</td>
            <td>fatima@gmail.com</td>
            <td>0985674321</td>
            <td>Staff</td>
            <td>
                <button class="btn-edit">Edit</button>
                <button class="btn-delete">Delete</button>
            </td>
        </tr>

        <tr>
            <td>2</td>
            <td>Gabriel Hanna</td>
            <td>gabriel@gmail.com</td>
            <td>0353674231</td>
            <td>Staff</td>
            <td>
                <button class="btn-edit">Edit</button>
                <button class="btn-delete">Delete</button>
            </td>
        </tr>
    </table>

    <!-- FORM -->
    <div class="form-box">
        <h3>New Employee</h3>

        <form>
            <table class="form-table">
                <tr>
                    <td>Name</td>
                    <td><input type="text"></td>
                    <td>Email</td>
                    <td><input type="email"></td>
                </tr>

                <tr>
                    <td>Phone</td>
                    <td><input type="text"></td>
                    <td>Position</td>
                    <td>
                        <select>
                            <option>-- Select Position --</option>
                            <option>Staff</option>
                            <option>Manager</option>
                            <option>CEO</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Sex</td>
                    <td colspan="3">
                        <input type="radio" name="sex"> Male
                        <input type="radio" name="sex"> Female
                    </td>
                </tr>

                <tr>
                    <td colspan="4" class="form-action">
                        <button class="btn-save">Save</button>
                        <button class="btn-cancel">Cancel</button>
                    </td>
                </tr>
            </table>
        </form>
    </div>

</div>

</body>
</html>
