<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Quản lý điểm sinh viên</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        padding: 40px;
      }

      .wrapper {
        width: 700px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.08);
      }

      h2 {
        margin-bottom: 15px;
      }

      .input-row {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
      }

      input {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      button {
        padding: 8px 16px;
        background: #2c7be5;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background: #1a5fc2;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: center;
      }

      th {
        background: #f0f0f0;
      }

      .low-score {
        background: #fff3b0;
      }

      .delete-btn {
        background: #e5533d;
      }

      .delete-btn:hover {
        background: #c9402c;
      }

      .summary {
        margin-top: 12px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <h2>Quản lý điểm sinh viên</h2>

      <div class="input-row">
        <input type="text" id="studentName" placeholder="Họ tên" />
        <input
          type="number"
          id="studentScore"
          placeholder="Điểm (0-10)"
          min="0"
          max="10"
          step="0.1"
        />
        <button id="addBtn">Thêm</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>STT</th>
            <th>Họ tên</th>
            <th>Điểm</th>
            <th>Xếp loại</th>
            <th>Thao tác</th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>
      </table>

      <div class="summary" id="stats">
        Tổng sinh viên: 0 | Điểm trung bình: 0
      </div>
    </div>

    <script>
      const list = [];

      const nameInput = document.getElementById("studentName");
      const scoreInput = document.getElementById("studentScore");
      const addBtn = document.getElementById("addBtn");
      const tbody = document.getElementById("tableBody");
      const stats = document.getElementById("stats");

      function rank(score) {
        if (score >= 8.5) return "Giỏi";
        if (score >= 7) return "Khá";
        if (score >= 5) return "Trung bình";
        return "Yếu";
      }

      function renderTable() {
        tbody.innerHTML = "";

        list.forEach((sv, index) => {
          const tr = document.createElement("tr");

          if (sv.score < 5) {
            tr.classList.add("low-score");
          }

          tr.innerHTML = `
            <td>${index + 1}</td>
            <td>${sv.name}</td>
            <td>${sv.score}</td>
            <td>${rank(sv.score)}</td>
            <td>
                <button class="delete-btn" data-id="${index}">Xóa</button>
            </td>
        `;

          tbody.appendChild(tr);
        });

        updateStats();
      }

      function updateStats() {
        const total = list.length;

        let avg = 0;

        if (total > 0) {
          const sum = list.reduce((acc, item) => acc + item.score, 0);
          avg = (sum / total).toFixed(2);
        }

        stats.textContent = `Tổng sinh viên: ${total} | Điểm trung bình: ${avg}`;
      }

      function addStudent() {
        const name = nameInput.value.trim();
        const score = parseFloat(scoreInput.value);

        if (name === "") {
          alert("Họ tên không được để trống");
          return;
        }

        if (isNaN(score) || score < 0 || score > 10) {
          alert("Điểm phải từ 0 đến 10");
          return;
        }

        list.push({
          name: name,
          score: score,
        });

        renderTable();

        nameInput.value = "";
        scoreInput.value = "";

        nameInput.focus();
      }

      addBtn.addEventListener("click", addStudent);

      scoreInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          addStudent();
        }
      });

      tbody.addEventListener("click", function (e) {
        if (e.target.classList.contains("delete-btn")) {
          const index = e.target.dataset.id;

          list.splice(index, 1);

          renderTable();
        }
      });
    </script>
  </body>
</html>
